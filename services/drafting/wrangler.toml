name = "lexdiary-drafting"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Same public values as the main app's wrangler.toml — not secrets, safe to
# duplicate. FIELD_ENCRYPTION_KEY is set separately via `wrangler secret put`
# and MUST be the same value as the Supabase Edge Functions secret of the
# same name (and the main app's) — the ai-generate-draft Edge Function
# writes ai_drafts.content with that key, and this service reads it back. A
# code-review fix reunified these after an earlier version of this service
# used its own independently-generated key, which made every AI-generated
# draft undecryptable here.
[vars]
