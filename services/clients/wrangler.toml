name = "lexdiary-clients"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Same public values as the main app's wrangler.toml — these are safe to
# duplicate (they're not secrets). FIELD_ENCRYPTION_KEY is set separately via
# `wrangler secret put` and is deliberately a DIFFERENT value from the main
# app's own FIELD_ENCRYPTION_KEY secret: this service was stood up with zero
# existing clients.notes rows to stay compatible with (verified live before
# extraction), so there was no reason to hand a second, independently
# deployed Worker the same root secret the main app's encryption depends on.
[vars]
SUPABASE_URL = "https://cjcjfdwdlsdgyvshuncn.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DnB_8STNU8FST_sCkRAM4w_K9c8A4Ft"

# Per-IP flood protection (Pass 5, P5-3). Cloudflare's native Rate Limiting
# binding: no KV, Durable Object or external service. namespace_id is unique
# per service so the seven Workers do not share one bucket. 200/minute is an
# anti-abuse floor, not a quota -- see src/rate-limit.ts for the reasoning.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 200, period = 60 }
